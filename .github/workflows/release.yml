name: Validate and release plugin

on:
  push:
    branches: [main]
    paths:
      - 'zona-simple-views/**'
      - 'tests/**'
      - 'scripts/build-release.py'
      - '.github/workflows/release.yml'
      - 'releases/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zona-plugin-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: PHP and JavaScript checks
        run: |
          php -l zona-simple-views/zona-simple-views.php
          php tests/php-behavior.php
          php tests/import-behavior.php
          php tests/quick-edit-behavior.php
          for script in zona-simple-views/assets/*.js; do node --check "$script"; done
          for test in tests/*-test.cjs; do node "$test"; done
      - name: Verify installable ZIP
        run: python3 scripts/build-release.py

  release:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build package
        run: python3 scripts/build-release.py
      - name: Publish version with installable ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(python3 -c 'from pathlib import Path; import re; print(re.search(r"Version: (\d+\.\d+\.\d+)", Path("zona-simple-views/zona-simple-views.php").read_text()).group(1))')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; published assets remain unchanged."
            exit 0
          fi
          gh release create "$TAG" "releases/zona-simple-views-$VERSION.zip" "releases/zona-simple-views-$VERSION.sha256" --target "$GITHUB_SHA" --title "Zona Simple Views $VERSION" --notes-file "releases/$TAG.md"
